        .fundo {
            display: flex;
            width: 100%;
            height: 100%;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 10px;
        }

        .card {
            background-color: rgb(8, 8, 8);
            width: 300px;
            height: 350px;
            text-align: center;
            border-radius: 15px;
            padding: 10px;
            align-items: center;
            color: rgba(255, 246, 176, 0.68);
            gap: 20px;
             margin-top: 15px;
        }

        .card img {
               /*Imagen ocupa */
                width: 100%;
                height: 80%;
                object-fit: cover;
                border-radius: 15px;

        }


          .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgb(255, 254, 254);
            box-shadow: 0 15px 20px rgb(255, 248, 248);

            color: rgb(212, 255, 0);
            
        }

        a {
          text-decoration: none;
          color: blue;
        }
